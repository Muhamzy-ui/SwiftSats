services:
  # ============================================================================
  # 1. SWIFTSATS BACKEND (Django REST API + Gunicorn)
  # ============================================================================
  - type: web
    name: swiftsats-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: SECURE_SSL_REDIRECT
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: QUIDAX_API_KEY
        sync: false
      - key: QUIDAX_SECRET_KEY
        sync: false

  # ============================================================================
  # 2. SWIFTSATS FRONTEND (React + Vite Static Site)
  # ============================================================================
  - type: staticSite
    name: swiftsats-frontend
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: "npm install && npm run build"
    publishPath: "dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        sync: false
