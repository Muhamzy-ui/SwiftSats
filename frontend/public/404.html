<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>SwiftSats</title>
    <script>
      // Single Page Apps fallback: preserve path and query for React Router
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      window.location.replace('/' + (path.startsWith('/') ? path.substring(1) : path) + search + hash);
    </script>
    <meta http-equiv="refresh" content="0;URL='/'">
  </head>
  <body style="background:#07080d;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <p>Loading SwiftSats...</p>
  </body>
</html>
