<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>SwiftSats</title>
    <script>
      // Single Page Apps fallback: store destination and redirect to index
      try {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        sessionStorage.setItem('swiftsats_spa_redirect', path + search + hash);
      } catch (e) {}
      window.location.replace('/');
    </script>
    <meta http-equiv="refresh" content="0;URL='/'">
  </head>
  <body style="background:#07080d;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <p>Loading SwiftSats...</p>
  </body>
</html>
