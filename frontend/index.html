    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>SwiftSats — Instant Crypto with Naira Bank Transfer</title>
    <meta name="description" content="Buy cryptocurrency instantly in Nigeria via bank transfer with zero account registration. Live Quidax market rates and automated payout." />
    <meta property="og:title" content="SwiftSats — Instant Crypto Onramp" />
    <meta property="og:description" content="Exchange Naira directly to Bitcoin, USDT, and Solana with automated instant payout." />
    <meta property="og:image" content="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var t = localStorage.getItem('swiftsats_theme') || 'light';
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch(e) {}

        // Single Page Apps fallback: restore deep URL from 404 handler
        try {
          var redirect = sessionStorage.getItem('swiftsats_spa_redirect');
          if (redirect) {
            sessionStorage.removeItem('swiftsats_spa_redirect');
            if (redirect !== (window.location.pathname + window.location.search + window.location.hash)) {
              window.history.replaceState(null, null, redirect);
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="antialiased font-sans selection:bg-emerald-100 selection:text-emerald-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
