    <meta name="apple-mobile-web-app-title" content="SwiftSats" />

    <title>SwiftSats — Instant Crypto with Naira Bank Transfer</title>
    <meta name="description" content="Buy cryptocurrency instantly in Nigeria via bank transfer with zero account registration. Live market rates and automated 24/7 payout." />
    
    <!-- Open Graph / WhatsApp / Facebook Sharing -->

    <meta property="og:image" content="https://swiftsats.onrender.com/og-image.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SwiftSats — Instant Crypto in Nigeria" />
    <meta name="twitter:description" content="Exchange Naira directly to USDT, Bitcoin & Solana in 60 seconds with automated instant 24/7 payout." />
    <meta name="twitter:image" content="https://swiftsats.onrender.com/og-image.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var t = localStorage.getItem('swiftsats_theme') || 'light';
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch(e) {}

        // Dynamic PWA Manifest for Admin Console vs User Onramp
        try {
          var hasAdmin = !!localStorage.getItem('swiftsats_admin_token');
          var isCustomerView = sessionStorage.getItem('swiftsats_view_customer_site') === 'true';
          if (window.location.pathname.startsWith('/admin') || (hasAdmin && !isCustomerView)) {
            var manifestLink = document.querySelector('link[rel="manifest"]');
            if (manifestLink) {
              manifestLink.setAttribute('href', '/admin-manifest.json');
            }
            var titleMeta = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (titleMeta) {
              titleMeta.setAttribute('content', 'SwiftAdmin');
            }
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="antialiased font-sans selection:bg-emerald-100 selection:text-emerald-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
